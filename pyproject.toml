[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localswap"
version = "0.3.0"
description = "Swap cloud media generation for local device compute: images + video (OpenVINO GenAI), neural upscale + frame interpolation (ncnn/Vulkan), cloned-voice TTS (Breeze), transcription (Whisper) — device-adaptive."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "local", "openvino", "tts", "image-generation", "video-generation", "voice-cloning", "agents"]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
image = ["openvino>=2024.3", "openvino-genai>=2024.3", "numpy"]
video = ["openvino>=2026.1", "openvino-genai>=2026.1", "numpy"]
stt = ["faster-whisper>=1.0"]
dev = ["pytest"]

[project.scripts]
localswap = "localswap.cli:main"

[tool.setuptools.packages.find]
include = ["localswap*"]
